# Tunable pipeline settings. Secrets are NOT here (they live in .env / Actions secrets).
# Source list lives in channels.yaml.

# --- LLM -------------------------------------------------------------------
# The scoring model, plus the local CLIs that stand in for it. The CLI tier is
# what makes a run possible with no API key at all, so leaving OPENAI_API_KEY
# unset degrades scoring rather than disabling it.
model: "gpt-5.6"
reasoning_effort: "medium"
# Tried in this order after the API, and the first one installed on this
# machine scores the run. LLM_CLIS in .env reorders or narrows the list, and
# path_env names a variable holding a full path for a CLI that is not on PATH.
# The prompt is appended after args, so a CLI that takes it as the value of -p
# ends its args with -p.
#
# Every entry is told to run without tools or with them fenced in, because the
# prompt carries event descriptions scraped from the web and from mail.
llm_clis:
  # --safe-mode keeps this machine's CLAUDE.md, hooks and MCP servers out of a
  # scoring call. --tools "" removes every built-in tool, since scoring needs
  # none. It sits before -p because --tools takes a list and would swallow a
  # prompt that followed it directly.
  - cmd: "claude"
    args: ["--model", "sonnet", "--safe-mode", "--no-session-persistence",
           "--disable-slash-commands", "--tools", "", "-p"]
    path_env: "CLAUDE_CLI"
  - cmd: "agy"
    args: ["--model", "gemini-3.8-flash-low", "--disable-slash-commands", "--sandbox", "-p"]
    path_env: "AGY_CLI"
  # --skip-git-repo-check was required back when this project was not a git
  # repo and codex refused to run outside a trusted directory, failing every
  # score with exit 1. It is a git repo again, but the scorer runs codex in
  # whatever directory the run was started from, and dropping the flag is an
  # untested behaviour change. --sandbox read-only lets a model-generated
  # command read but never write.
  - cmd: "codex"
    args: ["exec", "--skip-git-repo-check", "--sandbox", "read-only",
           "-c", "model=gpt-5.6-luna", "-c", "model_reasoning_effort=low"]
    path_env: "GPT_CLI"
# One CLI worker is one subprocess, and they all share that CLI's rate limit.
# Raising this clears a backlog faster but multiplies the concurrent load.
score_workers: 5

# --- Scoring preferences ---------------------------------------------------
# Everything here describes one reader, so a different reader edits this
# section and no code. The profile that `fit` is judged against is not here. It
# comes from PROFILE_PATH or RESUME_TEXT in .env (see config._profile_text).
#
# event_preferences and travel_cost each have a `describe` half, the prose the
# LLM tiers read, and a keyword half, the substrings the keyword tier matches
# when no model is reachable. Edit both halves together or the two tiers start
# answering different questions.

# access_value, the worth of attending this KIND of event, independent of its
# topic. Exactly five levels, doubled to 1-10 by both tiers, because the rank
# thresholds below are tuned on that scale. Keyword weights use the same 1-5
# levels, and an event takes the highest level any of its terms reaches.
# Keywords match as word prefixes rather than exact phrases, so "hack" reaches
# "hackathon". Exact-phrase matching once left 65 of 70 events at the floor,
# because real titles read "Career Symposium", "Campus to Career" and "Co-op 101".
event_preferences:
  describe:
    5: "an employer will see your materials or speak with you with hiring intent (resume drop, direct consideration, career fair, on-site interview event)"
    4: "an employer or school career office runs it and staff are present to meet (company info session, employer mixer, co-op advising session, campus recruiting)"
    3: "a named company hosts and its engineers attend, but there is no hiring channel"
    2: "industry people are present with no employer channel (hackathon, summit, meetup)"
    1: "social or purely academic (poker night, paper reading, film screening)"
  keywords:
    direct consideration: 5
    resume: 5
    career fair: 5
    careerfair: 5
    hiring event: 5
    on-site interview: 5
    onsite interview: 5
    job fair: 5
    recruiting event: 5
    career: 4
    co-op: 4
    coop: 4
    internship: 4
    intern: 4
    info session: 4
    information session: 4
    infosession: 4
    recruit: 4
    employer: 4
    mixer: 4
    open house: 4
    symposium: 4
    new grad: 4
    hiring: 4
    interview: 4
    fireside: 3
    office hours: 3
    tech talk: 3
    speaker series: 3
    hack: 2
    summit: 2
    conference: 2
    meetup: 2
    workshop: 2
    demo day: 2
    networking: 2

# fit, for the keyword tier only. The LLM tiers judge fit against the profile.
# Topical terms ONLY. Career words were once in here, which put their weight on
# the wrong axis, so "Campus to Career" scored fit 2 and access 1 when it should
# be the reverse. Anything that signals the kind of event belongs above.
# The penalty damps social filler that still appears on tech calendars rather
# than excluding it, because a founder dinner is a weak lead, not a wrong one.
fit_keywords:
  terms:
    ai: 2
    machine learning: 3
    ml: 2
    llm: 3
    agent: 2
    genai: 3
    software: 3
    engineer: 3
    developer: 3
    data: 2
    robotics: 2
    backend: 3
    frontend: 2
    infra: 2
    cloud: 2
    security: 2
    computer science: 3
    research: 2
    startup: 1
    product: 1
  penalty:
    poker: -3
    chocolate: -3
    yoga: -3
    soccer: -3
    karaoke: -3
    tasting: -3
    party: -2
    happy hour: -1

# cost, the burden of getting there, 1-10. Shown in the digest and never
# multiplied into the rank (see Score.rank). Each place maps to a level that
# `describe` names for the LLM tiers. A location naming places at two levels
# takes the cheaper one, and a location naming none takes `default`.
travel_cost:
  virtual: 1
  default: 3
  describe:
    2: "South Bay"
    5: "San Francisco or East Bay"
  places:
    san jose: 2
    santa clara: 2
    sunnyvale: 2
    mountain view: 2
    palo alto: 2
    cupertino: 2
    milpitas: 2
    campbell: 2
    los altos: 2
    san francisco: 5
    oakland: 5
    berkeley: 5
    emeryville: 5
    alameda: 5

# The language of the one-sentence reason each LLM score carries. The keyword
# tier writes its own short English reason and ignores this.
reason_language: "TRADITIONAL CHINESE (zh-TW)"

# DO NOT add a minimum-length floor for descriptions. A floor around 400 chars
# is the usual way to reject ATS marketing teasers, a pathology events do not
# have, and a genuinely complete event blurb is routinely shorter than that.
# Such a floor would mark real descriptions absent and downgrade them to
# title-only scoring.

# --- Keyword gate ----------------------------------------------------------
# min_hits 1 means a single matching term is enough to pass. That makes a LONGER
# list more permissive and a SHORTER list stricter, which is the opposite of the
# usual intuition, so shortening this list tightens the filter.
min_hits: 1

# APPLIES TO THE GMAIL SOURCE ONLY. Structured sources (jsonld, wordpress_rest)
# skip the gate entirely. Two reasons, both measured. The geo
# filter already cut Cerebral Valley from 20 events to 4, so there is no LLM cost
# left to save; and the gate dropped 1 of those 4 on a naming technicality, since
# "Recursive Self Improvement Hack: Co-Scientist" does not contain "hackathon".
keyword_gate_applies_to: ["gmail_label"]

# The gate reads Event.description, and GmailLabelSource puts the message body
# there so a mail whose subject is "New events this week" is judged on what it
# actually says. This bound is what stops one long message from matching every
# term at once: a single newsletter issue measured 564,318 characters after
# HTML stripping and contained nearly every candidate term, so an unbounded
# match with min_hits 1 would admit everything.
#
# It governs mailbox items only, since keyword_gate_applies_to lists just
# gmail_label. Two bounds apply in series and they differ: the source stores
# max_description_chars of body (what the scorer reads), and the gate then looks
# at only the first keyword_match_prefix_chars of that.
keyword_match_scope: "subject+prefix"
keyword_match_prefix_chars: 2000

# Phrases stating a listing is FULL (vs. the interest keywords below). Matched
# the same way, lowercased substrings over title plus description, since no
# source exposes a capacity field.
#
# A match is still scored and recorded, then withheld from the digest with
# ledger state sold_out, so "why was I never told about X" always has an
# answer instead of silence.
#
# Keep these NARROW. Each must read as a statement that THIS event is full, not
# as marketing: "seats sell out fast" is a sales line and must not match, which
# is why entries are phrases, not bare words. "registration is closed" counts
# but a bare "closed" does not, since that also describes a passed deadline,
# already handled by the date window.
#
# Measured 2026-09-10, the listing that motivated this read
# "K-AI Tech Week - Silicon Valley (SOLD OUT)".
capacity_markers:
  - "sold out"
  - "sold-out"                 # both spellings, sites differ
  - "soldout"
  - "at capacity"
  - "at full capacity"
  - "event is full"
  - "this event is full"
  - "waitlist only"            # a waitlist means the seats are gone
  - "join the waitlist"
  - "waitlist is open"
  - "registration is closed"
  - "no longer accepting"

keywords:
  # Confirmed keep. Each means a real pipeline to an employer, not a talk.
  - "direct consideration"   # an employer campaign name, not a generic phrase
  - "career fair"
  - "info session"
  - "information session"    # long form; both spellings needed
  - "mixer"                  # catches NEU's "Co-op Poster Expo & Employer Mixer"
  - "hack"                   # covers hack / hackathon / hackday, deliberately
  # Left unannotated during selection, kept on a no-objection reading.
  - "interview"
  - "open house"
  # On probation. Added to gather evidence, not because they are trusted. Review
  # against per-keyword hit stats before keeping them permanently.
  - "recruit"                # covers recruiter / recruiting / recruitment
  - "summit"
  - "meetup"
  - "new grad"

# Rejected, with the reason, so they do not get re-proposed later.
#   resume, on-site, onsite, workshop, panel, conference  -> too common, they
#     appear on events of every kind and would not discriminate
#   networking, tech talk                                 -> employers who hire
#     do not staff these
#   demo day                                              -> not relevant
#   intern, student, university, campus, co-op, northeastern -> job newsletters
#     are saturated with these words
#   rsvp, register, sign up, save your spot, deadline      -> present in every
#     marketing email, so as a min_hits 1 gate they admit everything. Keep them
#     as SCORING signals instead, never as gate terms.

# The term that admitted each item is always recorded, so the probation list can
# be judged on data rather than recollection.

# --- Geography -------------------------------------------------------------
# The place names the geo filter matches live in channels.yaml under `geo`.
#
# The zone absolute times are DISPLAYED in, which has to agree with that
# geography or the digest states a time in a region the reader is not in. It is
# NOT the zone anything is stored in: Event.start keeps whatever offset its
# source used, and notifier.format_digest converts on the way out. Before
# that conversion existed, every neu-alumni-events row was observed printing
# 7 hours late because it carries +00:00 while Luma carries -07:00.
display_timezone: "America/Los_Angeles"
# How far ahead an event may start and still be reported. Raised from 30 because
# a horizon that far out costs nothing measurable: on one full live run
# it dropped 0 of 150 in-region events, while the LOWER bound (_START_GRACE)
# dropped 49 that had already started. A short digest is that floor, never this
# ceiling. Kept at all only to stop a mistyped year reaching the scorer, and set
# generously so an event announced months ahead is seen while seats remain.
lookahead_days: 120
# A listing open this many days or more gets two exceptions. Once started it
# stays in scope while its end is more than this far away, and when its stated
# window spans this long it skips the geo filter. Many such windows are
# registrations for an in-person event elsewhere, which is accepted, and 30 is
# a starting point to tune against the digests it produces. Measured 2026-10-11
# on the seven Eightfold tenants, 68 events passed instead of 26, and most of
# the 42 added were campus events in Singapore and at other schools. No ledger
# row from any other source had a window this long.
long_running_days: 30

# --- Delivery --------------------------------------------------------------
# At most one email per run, with up to four sections (see notifier.py).
# Chosen over three separate sweeper emails because there is no push channel,
# and three mails a day for one event reads as spam rather than urgency. The
# send time is whatever schedules the run, not a setting here.
urgent_section_within_hours: 72
# The shortest time between an event's first mail and its LAST CALL. Without it
# an event first mailed just before the window opens is reminded on the very
# next run. 24 is a judgement, not a measurement. An event first mailed INSIDE
# the window never gets a LAST CALL at all, whatever this says.
resweep_min_gap_hours: 24

# Score thresholds. rank = fit x access_value, so 1-100.
#
# Measured on the first full LLM run (83 events): the distribution is bimodal,
# 24 events at rank 1-4, 13 in a grey band, 46 at 20+. Without a floor all 24
# reached the digest, including "No Limit: Executive Poker Tournament" and a
# student health-plan orientation, each correctly scored as irrelevant and each
# mailed anyway, because scoring was never wired to filtering.
digest_min_rank: 10

# P0 is the only tier meant to interrupt, so it is deliberately the narrowest.
# At the old value of 24 it captured 26 of 83 events, a third of everything, and
# a tier that fires on a third of items is not an alarm.
p0_min_rank: 40
p1_min_rank: 9

# An event whose start could not be determined is capped at P1 rather than
# escalated to P0. Escalating unknowns is right when the alternative is missing
# a deadline, but combined with a low P0 floor it turned every extraction
# failure into an interruption.
unknown_time_max_urgency: "P1"
# Every digest carries an .ics attachment and nothing writes to a calendar; the
# Gmail scope stays read-only. Stated here rather than configured, because a
# switch nothing reads looks like a live setting.

# --- Dedupe ----------------------------------------------------------------
# Two keys, in order. First the canonical URL with utm_* stripped, which is why
# the example below collides at all: both sources point at the same
# cerebralvalley.ai/events URL. Then, after extraction has filled in the times,
# the event's NAME plus the INSTANT it starts, which catches the same event
# published under two different URLs. Compared as an instant, not as text, since
# schema.org markup carries milliseconds where a scraped page does not.
#
# A start time is required for the second key. Two undated listings sharing a
# name are far more likely a recurring series, one meetup across many nights,
# than one event seen twice.
# The same event legitimately arrives twice, e.g. Cerebral Valley reaches us both
# as a labelled newsletter and as JSON-LD from cerebralvalley.ai/events. On a
# collision prefer the structured record: its dates are typed rather than parsed
# out of prose, which is the largest correctness risk in the whole pipeline.
# luma_discover leads because its address names the city, where a Luma
# calendar's JSON-LD often names only a venue the geo filter cannot place, and
# an empty field on the winner is still filled from the losing copy.
source_precedence: ["luma_discover", "jsonld", "wordpress_rest", "eightfold", "newsletter", "gmail_label"]

# --- Run behaviour ---------------------------------------------------------
# What the very first run does with a backlog nothing has reported yet.
# Modes are listed in config.FIRST_RUN_MODES; anything else fails the load.
#
# report_everything mails the whole in-scope backlog once. It makes recent_days
# and require_known_publish_time below DEAD, since _seed_eligible is the only
# reader of either -- they are left in place because switching back to
# seed_plus_recent revives both, and a deleted key would silently take the
# measured tuning with it.
#
# Reporting everything on day one is deliberate, and it is the opposite of what
# a job or posting feed should do. Events expire, so a backlog withheld on day
# one is not deferred, it is lost.
first_run:
  mode: "report_everything"
  recent_days: 3
  # An item whose publish time is unknown is EXCLUDED on the first run rather
  # than assumed recent. Measured consequence: schema.org Event
  # carries startDate and endDate but no datePublished, and none of the four
  # JSON-LD sources emit one, so all 70 of their events sit out the first run.
  # Only WordPress (post `date`), the newsletter archive (issue date) and Gmail
  # (message Date header) have a real publish time. Set this false to fall back
  # to startDate for sources that cannot report one.
  require_known_publish_time: true
request_timeout: 20
user_agent: "event-scout/1.0 (+https://github.com/)"
